[project]
name = "zotero-local-mcp"
version = "0.1.0"
description = "Local MCP server for reading an open Zotero library"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
zotero-local-mcp = "zotero_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zotero_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
